# PocketBase reverse proxy for vmt-mireacareer.l1ratch.ru
# Wildcard TLS cert for *.l1ratch.ru

server {
    listen 80;
    server_name vmt-mireacareer.l1ratch.ru;

    # ACME challenge для обновления сертификата (если нужно)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name vmt-mireacareer.l1ratch.ru;

    # Wildcard сертификат для *.l1ratch.ru
    # АДАПТИРУЙ ПУТИ под твою систему!
    ssl_certificate     /etc/letsencrypt/live/l1ratch.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/l1ratch.ru/privkey.pem;

    # TLS hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types application/json text/plain application/javascript;
    gzip_min_length 1000;

    # Max upload size (для картинок постов)
    client_max_body_size 20M;

    # PocketBase API + Admin UI + Files
    location / {
        proxy_pass http://pocketbase:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support для realtime (если понадобится)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }
}
